name: docker-push-workflow

on:
  workflow_call:
    inputs:
      push:
        description: "Whether to push the Docker image"
        required: true
        type: boolean
      release:
        description: "Whether to push as latest release"
        required: false
        default: false
        type: boolean
      version:
        description: "Version to use"
        required: false
        default: ""
        type: string
    secrets:
      dockerhub_username:
        description: "Docker Hub username; only required when push is enabled"
        required: false
      dockerhub_token:
        description: "Docker Hub token; only required when push is enabled"
        required: false
  workflow_dispatch:
    inputs:
      push:
        description: "Whether to push the Docker image"
        required: true
        type: boolean
      release:
        description: "Whether to push as latest release"
        required: false
        default: false
        type: boolean
      version:
        description: "Version to use"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  docker-vars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version || format('{0}-{1}', github.sha, steps.commit-timestamp.outputs.timestamp) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Get Git commit timestamp
        id: commit-timestamp
        run: echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - run: echo "Exposing env vars"

  docker:
    needs: [docker-vars]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_VERSION: ${{ inputs.version || needs.docker-vars.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Set up Docker
        uses: docker/setup-docker-action@e61617a16c407a86262fb923c35a616ddbe070b3 # v4.6.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Check Docker Hub credentials
        id: dockerhub-credentials
        if: ${{ inputs.push }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Docker Hub username and token are required when Docker publishing is enabled."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}
      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.github_token }}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          provenance: true
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.push && inputs.release && format('{0}/altairgraphqlapi:latest', secrets.dockerhub_username) || '' }}
            ${{ inputs.push && env.IMAGE_VERSION && format('{0}/altairgraphqlapi:{1}{2}', secrets.dockerhub_username, env.IMAGE_VERSION, inputs.release && '-release' || '') || '' }}
            ${{ inputs.push && inputs.release && format('ghcr.io/{0}/altairgraphqlapi:latest', github.repository_owner) || '' }}
            ${{ inputs.push && env.IMAGE_VERSION && format('ghcr.io/{0}/altairgraphqlapi:{1}{2}', github.repository_owner, env.IMAGE_VERSION, inputs.release && '-release' || '') || '' }}
